title: Borrado de instantáneas de volumen con vssadmin
id: 3b8e5c1a-7d2f-4e6b-9a10-c4d5e6f7a8b9
status: experimental
description: |
  Detecta el uso de vssadmin para eliminar instantáneas de volumen (Shadow Copies),
  paso habitual de los operadores de ransomware antes del cifrado para impedir la recuperación.
references:
  - https://attack.mitre.org/techniques/T1490/
author: CIAC LATAM Community
date: 2026-11-14
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\vssadmin.exe'
  selection_cli:
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: all of selection_*
falsepositives:
  - Scripts de mantenimiento o software de copias de seguridad que gestionan instantáneas
level: high
